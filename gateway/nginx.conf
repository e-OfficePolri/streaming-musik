events {}

http {
  server {
    listen 80;

    location /auth/ {
      proxy_pass http://auth-service:3001/;
    }

    location /catalog/ {
      proxy_pass http://catalog-service:3002/;
    }

    location /users/ {
      proxy_pass http://user-service:3003/;
    }

    location /media/ {
      proxy_pass http://media-service:8080/;
    }

    location /subscriptions/ {
      proxy_pass http://payment-service:3003/;
    }
  }
}

# Catatan: ini contoh dasar untuk local dev.
# Untuk produksi, pertimbangkan Kong atau AWS API Gateway yang punya
# fitur rate limiting, auth plugin, dan observability bawaan.
